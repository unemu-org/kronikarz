# Zestaw wzorcowy (gold) dla scripts/eval-digitize.py.
#
# Pliki w data/gold/ to zamrożone kopie stron zweryfikowanych ręcznie przez człowieka.
# Żaden pipeline (CV, VLM, gen-stubs, vision-*) NIGDY ich nie edytuje ani nie nadpisuje.
# Poprawka wzorca = świadoma, ręczna decyzja człowieka: nowa kopia ze źródła + nowe sha256
# poniżej + osobny commit.
#
# scope:
#   full       — bramki + piny + porty + cross_refy + druty/nety (wszystkie metryki)
#   gates_only — bramki, piny, porty, cross_refy; bez drutów i spójności netów
#
# Układ: <pakiet>/<strona>.sch.yaml; <pakiet>/package.yaml to zamrożony rejestr komponentów
# pakietu (kontekst, sprawdzany sha256 jak strony). Każdy plik z listy MUSI mieć sha256;
# brak pliku = błąd (exit 3), brak sha256 lub niezgodność = błąd (exit 3), chyba że
# --allow-modified. Kandydat ma układ <pakiet>/<strona>.sch.yaml albo <pakiet>/pages/<strona>.sch.yaml.
#
# Historia poprawek wzorca (każda po decyzji opiekuna, ponowne zamrożenie ze źródła):
#   - 2-59: net "" (7 odcinków-śmieci na krawędziach prostokątów bramek, niewidocznych
#     w viewerze, łączących różne nety) usunięty po kontroli wizualnej skanu.
#   - 2-59, 2-60, package.yaml: litery bramek M1 (2-59: piny 9→8 = D, 1→2 = A) i M47
#     (2-60: 74170 ma jedną bramkę A) ustawione z numerów pinów w ic_map; package.yaml:
#     M1 dostaje bramkę D na 2-59.
#   - package.yaml: typy z nadruku po decyzji opiekuna 2026-11-26/27: M55 ic 170→04 (2-58),
#     M18 ic 74→174 (2-63), M8 ic 00→175 (2-63; piny M8 bez zmian).
#   - 2-58: port A49 '-PC'→'-RC' (nadruk), net '-PC'→'-RC' dla wszystkich końcówek (także
#     port C47) — po decyzji opiekuna 2026-11-26/27.
#   - 2-58: M52 bramka B, lewe piny 11/12→1/13 (kolejność 1, 13, 9, 10 jak na rysunku;
#     pozycje i nety bez zmian) — po decyzji opiekuna 2026-11-26/27.
#   - 2-58: M7 bramka B, numery pinów 5 i 6 zamienione (6 nad 5; druty i nety zostają na
#     swoich pozycjach; label_left 5/6→6/5) — po decyzji opiekuna 2026-11-26/27.
#   - 2-63: M19 piny 9 (C) i 1 (R) z lewej, nie u góry (side top→left, pozycje bez zmian)
#     — po decyzji opiekuna 2026-11-26/27.
#   - 2-63: M30 pin 4 nienarysowany na arkuszu — zostaje we wzorcu jako disconnected (plik
#     bez zmian; prawda bake-offu przez TRUTH_OVERRIDES) — po decyzji opiekuna 2026-11-26/27.
